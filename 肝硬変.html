<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>肝硬変</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<calc>
<p><strong>Child-Pugh分類</strong></p>
<label for="cp-bilirubin">T-bil（mg/dL）</label>
<input type="number" id="cp-bilirubin" min="0" step="0.1" placeholder="例：1.8"><br>
<label for="cp-albumin">Alb（g/dL）</label>
<input type="number" id="cp-albumin" min="0" step="0.1" placeholder="例：3.2"><br>
<label for="cp-inr">PT-INR</label>
<input type="number" id="cp-inr" min="0" step="0.01" placeholder="例：1.5"><br>
<label for="cp-ascites">Water</label>
<select id="cp-ascites">
    <option value="">Select</option>
    <option value="1">なし</option>
    <option value="2">軽度</option>
    <option value="3">中度量以上</option>
</select><br>
<label for="cp-encephalopathy">Coma</label>
<select id="cp-encephalopathy">
    <option value="">Select</option>
    <option value="1">なし</option>
    <option value="2">軽度（Ⅰ・Ⅱ）</option>
    <option value="3">昏睡（Ⅲ以上）</option>
</select>
<button type="button" onclick="calculateChildPugh()">Calc</button>
<div id="cp-error" class="calculator-error"></div>
<div id="cp-result" class="calculator-result">
<div class="result-score">Child-Pugh score<strong id="cp-total">-</strong><span>点</span></div>
<div class="result-class">
<span id="cp-class">-</span>
</div>
<div id="cp-detail" class="result-detail"></div>
</div></div>
</calc>

<h3><a href="documents/LC.pdf">肝硬変ガイドライン</a></h3>

</main>
<div id="footer"></div>
<script src="js/gastro.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
