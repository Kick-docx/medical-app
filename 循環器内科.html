<h2>AMI</h2>
<p>
HAERTスコア
HEARTスコアが0〜3点でトロポニンが2回陰性（3時間あけて2回目を測定）であれば,
30日以内の主要心血管イベント（major adverse cardiac event;MACE）の可能性は1%.
HEARTスコアが高ければ経過観察もしくは入院を.</p>
