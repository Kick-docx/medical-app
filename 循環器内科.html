<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>循環器内科</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<h2><a href="心電図.html">○心電図</a></h2>
<h2><a href="心不全.html">○心不全</a></h2>
<h2><a href="心房細動.html">○心房細動</a></h2>
<h2>✔️AMI</h2>
<p>
<strong>HAERTスコア</strong>
<br>HEARTスコアが0〜3点でトロポニンが2回陰性（3時間あけて2回目を測定）であれば，30日以内の主要心血管イベント（major adverse cardiac event;MACE）の可能性は1%．
HEARTスコアが高ければ経過観察もしくは入院を．</p>
<div>
    <label for="heart-history">History（病歴）</label>
    <select id="heart-history">
        <option value="">選択してください</option>
        <option value="0">軽度疑い（0点）</option>
        <option value="1">中等度疑い（1点）</option>
        <option value="2">強く疑う（2点）</option>
    </select>
</div>
<br>
<div>
    <label for="heart-ecg">ECG</label>
    <select id="heart-ecg">
        <option value="">選択してください</option>
        <option value="0">正常（0点）</option>
        <option value="1">非特異的再分極異常（1点）</option>
        <option value="2">有意なST偏位（2点）</option>
    </select>
</div>
<br>
<div>
    <label for="heart-age">年齢</label>
    <input
        type="number"
        id="heart-age"
        min="0"
        step="1"
        placeholder="例：65"
    >
    歳
</div>
<br>
<div>
    <label for="heart-risk">Risk factors（心血管リスク因子）</label>
    <select id="heart-risk">
        <option value="">選択してください</option>
        <option value="0">リスク因子なし（0点）</option>
        <option value="1">1～2個（1点）</option>
        <option value="2">3個以上 または 既知の動脈硬化性疾患（2点）</option>
    </select>
</div>
<br>
<div>
    <label for="heart-troponin">Troponin</label>
    <select id="heart-troponin">
        <option value="">選択してください</option>
        <option value="0">基準値以下（0点）</option>
        <option value="1">基準値の1～3倍（1点）</option>
        <option value="2">基準値の3倍超（2点）</option>
    </select>
</div>
<br>
<button type="button" onclick="calculateHEART()">
    計算
</button>
<p id="heart-error" style="color:red;"></p>
<div id="heart-result" style="display:none;">
    <p>
        <strong id="heart-total"></strong> / 10点
    </p>
    <p>
        <strong id="heart-risk-level"></strong>
    </p>
    <p id="heart-detail"></p>
</div>

</main>
<div id="footer"></div>
<script src="js/cardio.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
