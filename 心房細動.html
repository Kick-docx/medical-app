ワーファリン用量調節
<br>ヘパリン持続静注(APTT≧45-60)下に3-4mg/dayで開始．
<br>ヘパリンは10000単位から，12000,15000と上げていく．
<br>夕内服で2-3日毎に0.5-1.0mgずつ調整．
</p>
<img src="images/DOAC.jpg" width="100%">
<p>周術期のヘパリン置換
    <br>CHADS2 5-6点，機械弁置換後，弁膜症性AF
</p>
<p>ワーファリンからDOACへの置換
    <br>ワーファリン中止後，頻回にPT-INR測定し治療下限でDOAC開始．
</p>
