    <p>原発性アルドステロン症のスクリーニングは積極的に行う．
        <br>PAC(アルドステロン濃度)，PRA(血漿レニン活性)　←30分以上安静臥位の後
        <br>ARR=PAC/PRA>200でスクリーニング陽性．負荷試験へ．
        <br>※ACEi,ARB,βblocker,MRA,甘草は4週間中止．Kは補正後．の方が良い．
    </p>
    <p>甲状腺や褐色細胞腫のスクリーニングも適宜検討．</p>
