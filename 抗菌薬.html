<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>抗菌薬</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<div id="slideContainer" style="position: relative; text-align: center;">
    <img id="slideImage" src="images/antibiotics/01.png" style="width: 100%;">
    <!-- 左ボタン -->
    <button onclick="prevSlide()" style=
        "position: absolute;
        left: 10px; top: 50%; transform: translateY(-50%); 
        background: rgba(0,0,0,0.45); 
        color: white;
        border: none;
        font-size: 24px;
        padding: 10px 14px;
        border-radius: 4px;">＜
    </button>
    <!-- 右ボタン -->
    <button onclick="nextSlide()" style=
        "position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.45);
        color: white;
        border: none;
        font-size: 24px;
        padding: 10px 14px;
        border-radius: 4px;">＞
    </button>
</div>
<p id="slideNumber" style="text-align: center;">1 / 5</p>

<h2>CCr（Cockcroft-Gault）</h2>
<calc>
<label>年齢</label><input type="number" id="age2"><br>
<label>体重 (kg)</label><input type="number" id="weightCCr"><br>
<label>血清Cr (mg/dL)</label><input type="number" id="cr2" step="0.01"><br>
<label>性別</label><select id="sex2">
    <option value="male">男性</option>
    <option value="female">女性</option>
</select>
<button onclick="calcCCr()">Calc</button><br>
<p id="ccrResult"></p>
</calc>

</main>
<div id="footer"></div>
<script src="js/antibiotics.js"></script>
<script src="js/loader.js"></script>
</body>
</html>
