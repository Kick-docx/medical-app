<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>糖尿病診断</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<img src="images/DM/flow.avif" width="100%">
<p>抗GAD抗体の有無→T1DMか判断</p>
<p>T1DM疑いならHOMA-βでインスリン分泌能を評価
<br>→インスリン分泌能低下に関わらず抗GAD抗体陰性なら抗IA-2,ZnT8抗体も検索</p>
<p>T2DMならCPR Indexでインスリン分泌能を評価<br>※高血糖時は糖毒性あり有効でない．解除してから評価．</p>



<p><strong>Cペプチドインデックス（CPI）</strong><br>正常値：1.6, 0.8-1.0でインスリン療法へ</p>
<calc>
<label>空腹時血糖（mg/dL）</label><input type="number" id="fpg" step="0.1" placeholder="例：100"><br>
<label>空腹時Cペプチド（ng/mL）</label><input type="number" id="cpr" step="0.1" placeholder="例：2.0">
<button onclick="calcCPI()">Calc</button>
<p id="result"></p>
</calc>

<p><strong>HOMA-β</strong>　30%以下で分泌能低下</p>
<calc>
<label>空腹時血糖（mg/dL）</label><input type="number" id="fpg" placeholder="例：100"><br>
<label>空腹時インスリン（μU/mL）</label><input type="number" id="iri" placeholder="例：8">
<button onclick="calcHOMABeta()">Calc</button>
<p id="result"></p>
</calc>

<p><strong>HOMA-IR</strong>　1.6以下で正常，2.5以上でインスリン抵抗性あり</p>
<calc>
  <label for="homaGlucose">空腹時血糖値（mg/dL）</label>
  <input type="number" id="homaGlucose" min="0" step="any" placeholder="血糖値"><br>
  <label for="homaInsulin">空腹時インスリン値（μU/mL）</label>
  <input type="number" id="homaInsulin" min="0" step="any" placeholder="インスリン値">
  <button type="button" onclick="calculateHOMAIR()">calc</button>
  <div id="homaIRResult" aria-live="polite" style="margin-top:20px;">
    <p>HOMA-IR：－</p>
  </div>
</calc>


<script src="js/dm tx.js"></script>

</main>
<div id="footer"></div>
<script src="js/loader.js"></script>
</body>
</html>
