<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>糖尿病診断</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
<div id="header"></div>
<div id="menu"></div>
<div id="search"></div>
<main class="content">

<img src="images/DM/flow.avif" width="100%">
<p>抗GAD抗体の有無→T1DMか判断</p>
<p>T1DM疑いならHOMA-βでインスリン分泌能を評価
<br>→インスリン分泌能低下に関わらず抗GAD抗体陰性なら抗IA-2,ZnT8抗体も検索</p>
<p>T2DMならCPR Indexでインスリン分泌能を評価<br>※高血糖時は糖毒性あり有効でない．解除してから評価．</p>

<p><strong>Cペプチドインデックス（CPI）</strong><br>正常値：1.6, 0.8-1.0でインスリン療法へ</p>
<label>空腹時血糖（FPG, mg/dL）</label><br>
<input type="number" id="fpg" step="0.1" placeholder="例：100"><br>
<label>空腹時Cペプチド（CPR, ng/mL）</label><br>
<input type="number" id="cpr" step="0.1" placeholder="例：2.0"><br><br>
<button onclick="calcCPI()">計算</button>
<p id="result"></p>

<p><strong>HOMA-β計算</strong>　30%以下で分泌能低下</p>
<label>空腹時血糖（FPG, mg/dL）</label><br>
<input type="number" id="fpg" placeholder="例：100"><br>
<label>空腹時インスリン（IRI, μU/mL）</label><br>
<input type="number" id="iri" placeholder="例：8"><br><br>
<button onclick="calcHOMABeta()">計算</button>
<p id="result"></p>

<script src="js/dm tx.js"></script>

</main>
<div id="footer"></div>
<script src="js/loader.js"></script>
</body>
</html>
