  <p><strong>FIB-4 index</strong></p>
  <calc>
    <label for="fibAge">年齢（歳）</label>
    <input type="number" id="fibAge" min="1" step="1" placeholder="年齢"><br>
    <label for="fibAST">AST（U/L）</label>
    <input type="number" id="fibAST" min="0" step="any" placeholder="AST"><br>
    <label for="fibALT">ALT（U/L）</label>
    <input type="number" id="fibALT" min="0" step="any" placeholder="ALT"><br>
    <label for="fibPLT">血小板数（×10⁴/μL）</label>
    <input type="number" id="fibPLT" min="0" step="any" placeholder="血小板数">
  <button type="button" onclick="calculateFIB4()">calc</button>
  <div id="fibResult" aria-live="polite" style="margin-top:20px;">
    <p>FIB-4 index：－，肝線維化リスク：－</p></div>
  </calc>


<<p><strong>NFS</strong>　MASLDの肝線維化リスク</p>
<calc>
  <label for="nfsAge">年齢（歳）</label>
  <input type="number" id="nfsAge" min="1" step="1" placeholder="年齢"><br>
  <label for="nfsBMI">BMI（kg/m²）</label>
  <input type="number" id="nfsBMI" min="0" step="any" placeholder="BMI"><br>
  <label for="nfsDM">糖尿病または空腹時血糖異常</label>
  <select id="nfsDM">
    <option value="">Select</option>
    <option value="1">あり</option>
    <option value="0">なし</option>
  </select><br>
  <label for="nfsAST">AST（U/L）</label>
  <input type="number" id="nfsAST" min="0" step="any" placeholder="AST"><br>
  <label for="nfsALT">ALT（U/L）</label>
  <input type="number" id="nfsALT" min="0" step="any" placeholder="ALT"><br>
  <label for="nfsPLT">血小板数（×10⁴/μL）</label>
  <input type="number" id="nfsPLT" min="0" step="any" placeholder="血小板数"><br>
  <label for="nfsAlb">アルブミン（g/dL）</label>
  <input type="number" id="nfsAlb" min="0" step="any" placeholder="Alb">
  <button type="button" onclick="calculateNFS()">calc</button>
  <div id="nfsResult" aria-live="polite" style="margin-top:20px;">
    <p>NFS：－，肝線維化リスク：－</p>
  </div>
</calc>
