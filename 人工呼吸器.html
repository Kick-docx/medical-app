<h1>人工呼吸器の設定</h1>
<ul>
  <li>TV（1回換気量）：標準体型なら500ml, 体型に応じて減量する. 6-8mL/kgが目安, ARDSでは6mL/kg.</li>
  <li>呼吸回数：10回くらい. PaCO2に応じて設定, 死腔あるため呼吸回数で調整.</li>
  <li>酸素化：FiO2とPEEPで設定. FiO2は21%程度で必要最低限に（O2中毒, 無気肺の可能性）</li>
</ul>
